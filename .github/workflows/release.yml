name: Build & Release

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHORT_HASH=$(git rev-parse --short HEAD)
          TAG_NAME="v${VERSION_NAME}-beta"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="v${VERSION_NAME}-beta-${SHORT_HASH}"
          fi

          RELEASE_TITLE="AndDirStat v${VERSION_NAME} (Beta)"

          # Extract version notes from CHANGELOG.md (Latch release format)
          CHANGELOG_NOTES=$(awk -v ver="$VERSION_NAME" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*---[[:space:]]*$//' | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)

          if [ -z "$CHANGELOG_NOTES" ]; then
            CHANGELOG_NOTES=$(git log -1 --pretty=%B)
          fi

          # Generate commits and author list
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_LIST=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s by @%an in %h" | sed 's/@Lavanbarath B/@lavan8t/g')
          else
            COMMITS_LIST=$(git log -n 10 --pretty=format:"- %s by @%an in %h" | sed 's/@Lavanbarath B/@lavan8t/g')
          fi

          cat <<EOT > release-notes.md
${CHANGELOG_NOTES}

### Commits

${COMMITS_LIST}

Download the compatible version for your device from the assets below.

---
**Architecture Downloads:**
- **arm64-v8a**: Modern 64-bit Android devices
- **armeabi-v7a**: Older 32-bit ARM devices
- **x86_64**: Emulators and x86 devices
- **universal**: Compatible across all supported architectures
EOT

          APK_FILES=$(find app/build/outputs/apk/release -name "*.apk")

          echo "Publishing release $TAG_NAME with APKs:"
          echo "$APK_FILES"

          gh release create "$TAG_NAME" $APK_FILES \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease

      - name: Delete prod branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/prod
