name: Build & Release

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          TAG_NAME="v${VERSION_NAME}-beta"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="v${VERSION_NAME}-beta-${SHORT_HASH}"
          fi

          RELEASE_TITLE="AndDirStat v${VERSION_NAME} (Beta)"

          RELEASE_NOTES=$(cat <<EOT
          ### Commit: \`${SHORT_HASH}\`

          ${COMMIT_MSG}

          ---
          **Architecture Downloads:**
          - **arm64-v8a**: Modern 64-bit Android devices
          - **armeabi-v7a**: Older 32-bit ARM devices
          - **x86_64**: Emulators and x86 devices
          - **universal**: Compatible across all supported architectures
          EOT
          )

          APK_FILES=$(find app/build/outputs/apk/release -name "*.apk")

          echo "Publishing release $TAG_NAME with APKs:"
          echo "$APK_FILES"

          gh release create "$TAG_NAME" $APK_FILES \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease
